source [find interface/stlink.cfg]
transport select swd
adapter speed 100

source [find target/swj-dp.tcl]

set _CHIPNAME at32f425
set _CPUTAPID 0x2ba01477

swj_newdap $_CHIPNAME cpu \
    -irlen 4 \
    -ircapture 0x1 \
    -irmask 0xf \
    -expected-id $_CPUTAPID

dap create $_CHIPNAME.dap \
    -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu

target create $_TARGETNAME cortex_m \
    -dap $_CHIPNAME.dap

$_TARGETNAME configure \
    -work-area-phys 0x20000000 \
    -work-area-size 0x4000 \
    -work-area-backup 0

flash bank $_CHIPNAME.flash artery \
    0x08000000 0 0 0 $_TARGETNAME

reset_config none
