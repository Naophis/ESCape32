# OpenOCD config for the MOUSEG431 board (STM32G431KBU6 + MP6540HA).
#
# Usage:
#   openocd -f openocd_stm32g431.cfg -c "program build/MOUSEG431-rev17.1.hex verify reset exit"
#   openocd -f openocd_stm32g431.cfg -c "init" -c "halt" -c "reg pc" -c "shutdown"
#
# Unlike the previous AT32F425 board, STM32G431 is natively supported by
# OpenOCD's own target script, so nothing custom is needed here beyond
# selecting the adapter.

source [find interface/stlink.cfg]
transport select swd

source [find target/stm32g4x.cfg]
